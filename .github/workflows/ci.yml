name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: run ci
        run: |
          nix profile add nixpkgs#devenv
          devenv tasks run cambridge-reader-scraper:check

  docker:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Generate short SHA
        id: sha
        run: echo "short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image with Nix
        run: nix build .#docker --print-build-logs

      - name: Load image into Docker
        run: docker load < result

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}/cambridge-reader-scraper-app
          docker tag "$IMAGE:latest" "$IMAGE:${{ steps.sha.outputs.short }}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ steps.sha.outputs.short }}"
